name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Bash script (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Run tests
        run: bash tests/test.sh

  windows:
    name: PowerShell script (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare output with tests/expected.txt
        shell: pwsh
        run: |
          ./scripts/analyse-logs.ps1 tests/fixture.log 3>$null | Set-Content actual.txt
          $diff = Compare-Object (Get-Content actual.txt) (Get-Content tests/expected.txt)
          if ($diff) {
            $diff | Format-Table -AutoSize
            throw 'Output differs from tests/expected.txt'
          }
          Write-Host 'Output matches tests/expected.txt'
